<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моррион — Интерактивная карта</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=19" />
</head>
<body>

<div id="map"></div>
<div class="vignette"></div>

<div class="top-bar">
    <button class="map-btn" id="sidebarBtn" title="Список локаций (Ctrl+B)">☰ Локации</button>
    <div class="top-title">⚔ МОРРИОН</div>
    <button class="map-btn" id="editBtn" title="Режим редактирования">✏️ Редактировать</button>
    <button class="map-btn" id="backupBtn" title="Скачать бэкап всех данных" style="display:none;">💾 Бэкап</button>
    <button class="map-btn" id="restoreBtn" title="Восстановить из бэкапа" style="display:none;">📥 Восстановить</button>
    <button class="map-btn" id="factionsBtn" title="Справочник фракций">⚔️ Фракции</button>
    <button class="map-btn" id="resetViewBtn" title="Сбросить вид">🎯 Обзор</button>
</div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">📍 Локации</div>
        <button class="sidebar-close" id="sidebarClose" title="Закрыть">✕</button>
    </div>
    <div class="sidebar-search">
        <input type="text" id="sidebarSearch" placeholder="Поиск по названию...">
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
</aside>

<div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText">Загрузка...</span>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js?v=17"></script>
<script src="app.js?v=17"></script>
<script src="app2.js?v=17"></script>

</body>
</html>
