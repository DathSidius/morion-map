<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моррион — Интерактивная карта</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="map"></div>

<div class="top-bar">
    <div class="top-title">⚔ МОРРИОН</div>
    <button class="map-btn" id="editBtn" title="Режим редактирования">✏️ Редактировать</button>
    <button class="map-btn" id="resetViewBtn" title="Сбросить вид">🎯 Обзор</button>
</div>

<div class="status-bar" id="statusBar">
    <span class="dot"></span>
    <span id="statusText">Загрузка...</span>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
